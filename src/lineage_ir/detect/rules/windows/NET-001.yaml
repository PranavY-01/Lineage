id: NET-001
title: Proxy-execution binary made a network connection
severity: high
attack: [T1218, T1105]
tactics: [stealth, command-and-control]
why: >
  Signed Windows binaries that can run arbitrary code rarely need to open outbound
  connections; when they do, they are often fetching or talking to a payload.
match:
  event_id: 3
  image_name:
    - rundll32.exe
    - regsvr32.exe
    - mshta.exe
    - certutil.exe
    - msbuild.exe
    - installutil.exe
    - cmstp.exe
  initiated: 'true'
exclude: []
references: []
enabled: true
