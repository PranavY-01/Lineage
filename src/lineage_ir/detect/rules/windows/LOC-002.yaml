id: LOC-002
title: System binary name outside system directories
severity: high
attack: [T1036.005]
tactics: [stealth]
why: >
  Core Windows process names only ever run from the system directories; the same name
  anywhere else is a classic masquerade meant to blend into a process list.
match:
  event_id: 1
  image_name:
    - svchost.exe
    - lsass.exe
    - csrss.exe
    - services.exe
    - smss.exe
    - wininit.exe
    - winlogon.exe
    - spoolsv.exe
    - taskhostw.exe
exclude:
  - image|startswith:
      - 'c:\windows\system32\'
      - 'c:\windows\syswow64\'
      - 'c:\windows\winsxs\'
references: []
enabled: true
