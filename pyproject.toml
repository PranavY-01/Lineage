[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lineage-ir"
dynamic = ["version"]
description = "Offline reconstruction of Windows process lineage and attack storylines from Sysmon telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PranavY-01" }]
keywords = ["sysmon", "dfir", "incident-response", "evtx", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "evtx>=0.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
html = ["jinja2>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jsonschema>=4.21",
]

[project.scripts]
lineage = "lineage_ir.cli:app"

[tool.hatch.version]
path = "src/lineage_ir/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_ir"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lineage_ir",
    "tests",
    "schema",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design, start the CLI as a child process with a fixed argv,
# and shuffle inputs with seeded non-cryptographic randomness.
"tests/**" = ["S101", "S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
